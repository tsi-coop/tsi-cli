# generated by tsi, do not edit; regenerate with `tsi compose init --force` or `tsi compose up`
name: tsi
services:
    postgres:
        image: postgres:15-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:5432:5432
        env_file:
            - .tsi/env/postgres.env
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U $${POSTGRES_USER}
            interval: 5s
            timeout: 5s
            retries: 20
    tsi-dpdp-cms:
        image: tsicoop/tsi-dpdp-cms:v0.5.3
        restart: unless-stopped
        ports:
            - 127.0.0.1:8080:8080
        env_file:
            - .tsi/env/tsi-dpdp-cms.env
        volumes:
            - tsi-dpdp-cms-exports:/var/lib/tsi/exports/
            - ./.tsi/certs/tsi-dpdp-cms.p12:/etc/tsi/keystore.p12:ro
        depends_on:
            postgres:
                condition: service_healthy
        user: root
volumes:
    pgdata: {}
    tsi-dpdp-cms-exports: {}
