# generated by tsi, do not edit; regenerate with `tsi compose init --force` or `tsi compose up`
name: tsi
services:
    tsi-dpdp-cms:
        image: tsicoop/tsi-dpdp-cms:v0.5.3
        restart: unless-stopped
        ports:
            - 127.0.0.1:8080:8080
        env_file:
            - .tsi/env/tsi-dpdp-cms.env
        volumes:
            - tsi-dpdp-cms-exports:/var/lib/tsi/exports/
            - ./.tsi/certs/tsi-dpdp-cms.p12:/etc/tsi/keystore.p12:ro
        depends_on:
            tsi-dpdp-cms-db:
                condition: service_healthy
        user: root
    tsi-dpdp-cms-db:
        image: postgres:15-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:5432:5432
        env_file:
            - .tsi/env/tsi-dpdp-cms-db.env
        volumes:
            - tsi-dpdp-cms-pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U $${POSTGRES_USER}
            interval: 5s
            timeout: 5s
            retries: 20
    tsi-privacy-vault:
        image: tsicoop/tsi-privacy-vault:v0.3.0
        restart: unless-stopped
        ports:
            - 127.0.0.1:8081:8080
        env_file:
            - .tsi/env/tsi-privacy-vault.env
        volumes:
            - tsi-privacy-vault-exports:/var/lib/tsi/exports/
        depends_on:
            tsi-privacy-vault-db:
                condition: service_healthy
        user: root
    tsi-privacy-vault-db:
        image: postgres:15-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:5433:5432
        env_file:
            - .tsi/env/tsi-privacy-vault-db.env
        volumes:
            - tsi-privacy-vault-pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U $${POSTGRES_USER}
            interval: 5s
            timeout: 5s
            retries: 20
volumes:
    tsi-dpdp-cms-exports: {}
    tsi-dpdp-cms-pgdata: {}
    tsi-privacy-vault-exports: {}
    tsi-privacy-vault-pgdata: {}
