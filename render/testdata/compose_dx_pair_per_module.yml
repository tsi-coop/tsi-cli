name: tsi
services:
    node-a:
        image: tsicoop/tsi-dx-node:v0.3.0
        restart: unless-stopped
        ports:
            - 127.0.0.1:8082:8080
        env_file:
            - .tsi/env/node-a.env
        volumes:
            - node-a-exports:/var/lib/tsi/exports/
        depends_on:
            node-a-db:
                condition: service_healthy
        networks:
            default:
                aliases:
                    - node-a-server-1
        user: root
    node-a-db:
        image: postgres:15-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:5434:5432
        env_file:
            - .tsi/env/node-a-db.env
        volumes:
            - node-a-pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U $${POSTGRES_USER}
            interval: 5s
            timeout: 5s
            retries: 20
    node-b:
        image: tsicoop/tsi-dx-node:v0.3.0
        restart: unless-stopped
        ports:
            - 127.0.0.1:8083:8080
        env_file:
            - .tsi/env/node-b.env
