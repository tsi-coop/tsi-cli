# generated by tsi, do not edit; regenerate with `tsi compose init --force` or `tsi compose up`
name: tsi
services:
    node-a:
        image: tsicoop/tsi-dx-node:v0.3.0
        restart: unless-stopped
        ports:
            - 127.0.0.1:8082:8080
        env_file:
            - .tsi/env/node-a.env
        volumes:
            - node-a-exports:/var/lib/tsi/exports/
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            default:
                aliases:
                    - node-a-server-1
        user: root
    node-b:
        image: tsicoop/tsi-dx-node:v0.3.0
        restart: unless-stopped
        ports:
            - 127.0.0.1:8083:8080
        env_file:
            - .tsi/env/node-b.env
        volumes:
            - node-b-exports:/var/lib/tsi/exports/
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            default:
                aliases:
                    - node-b-server-1
        user: root
    postgres:
        image: postgres:15-alpine
        restart: unless-stopped
        ports:
            - 127.0.0.1:5432:5432
        env_file:
            - .tsi/env/postgres.env
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U $${POSTGRES_USER}
            interval: 5s
            timeout: 5s
            retries: 20
    tsi-compass:
        image: tsicoop/tsi-compass:v0.4.3
        restart: unless-stopped
        ports:
            - 127.0.0.1:8085:8080
        env_file:
            - .tsi/env/tsi-compass.env
        volumes:
            - tsi-compass-exports:/var/lib/tsi-compass/exports/
        depends_on:
            postgres:
                condition: service_healthy
        user: root
    tsi-dpdp-cms:
        image: tsicoop/tsi-dpdp-cms:v0.5.3
        restart: unless-stopped
        ports:
            - 127.0.0.1:8080:8080
        env_file:
            - .tsi/env/tsi-dpdp-cms.env
        volumes:
            - tsi-dpdp-cms-exports:/var/lib/tsi/exports/
            - ./.tsi/certs/tsi-dpdp-cms.p12:/etc/tsi/keystore.p12:ro
        depends_on:
            postgres:
                condition: service_healthy
        user: root
    tsi-privacy-vault:
        image: tsicoop/tsi-privacy-vault:v0.3.0
        restart: unless-stopped
        ports:
            - 127.0.0.1:8081:8080
        env_file:
            - .tsi/env/tsi-privacy-vault.env
        volumes:
            - tsi-privacy-vault-exports:/var/lib/tsi/exports/
        depends_on:
            postgres:
                condition: service_healthy
        user: root
volumes:
    node-a-exports: {}
    node-b-exports: {}
    pgdata: {}
    tsi-compass-exports: {}
    tsi-dpdp-cms-exports: {}
    tsi-privacy-vault-exports: {}
