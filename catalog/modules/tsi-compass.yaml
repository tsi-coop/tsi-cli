    - {file: 22_vendor_portal.sql, sha256: 97a72819314da7768282b1a62bd0f07524e1b982f18b408ff069201adf3e3c66}

# check_setup is public and reads the database.
ready:
  path: /api/v1/bootstrap/setup
  body: {_func: check_setup}
  expect: [200]

spec_defaults:
  admin:
    name: "{{.Admin.Name}}"
  api_key:
    create: false
    name: tsi-cli
    description: Created by tsi-cli

bootstrap:
  - id: setup
    description: Create the first administrator
    path: /api/v1/bootstrap/setup
    body:
      _func: complete_setup
      admin_name: "{{.Admin.Name}}"
      admin_email: "{{.Admin.Email}}"
      admin_password: "{{.Admin.Password}}"
      setup_token: "{{.Env.TSI_BOOTSTRAP_TOKEN}}"
    expect: [200, 201]
    already_done: [409]
  - id: login
    description: Log in as the administrator
    path: /api/v1/admin/user
    body:
      _func: login
      email: "{{.Admin.Email}}"
      password: "{{.Admin.Password}}"
    expect: [200]
    capture: {token: token}
    secret: [token]
    volatile: true
  - id: generate_api_key
    description: Generate an API key
    path: /api/v1/admin/apikey
    auth: bearer
    when: Spec.api_key.create
    body:
      _func: generate_api_key
      name: "{{.Spec.api_key.name}}"
      description: "{{.Spec.api_key.description}}"
    expect: [200, 201]
    capture: {api_key: api_key, api_secret: api_secret}
    secret: [api_secret]

smoke:
  - {id: ready, description: The app answers the readiness probe}
  - {id: setup_complete, description: Setup reports that the first administrator exists}
  - {id: wrong_password_refused, description: A wrong administrator password is refused with 401}
  - {id: unauthenticated_refused, description: An admin call without a session is refused with 401}
  - {id: reference_data, description: The migrations seeded the asset categories}
  - {id: asset_roundtrip, description: "An asset can be created, listed and deleted"}
